name: Verify GrapheneOS pin

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-verify
  cancel-in-progress: true

jobs:
  verify-pin:
    name: Verify signed manifest tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify signed upstream tag
        run: ./scripts/verify-pin.sh --network
