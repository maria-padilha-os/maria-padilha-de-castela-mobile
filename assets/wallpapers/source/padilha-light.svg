<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3120" viewBox="0 0 1440 3120" role="img" aria-label="Padilha light wallpaper: abstract cream daylight with wine lace">
  <title>Noite de Padilha — light</title>
  <desc>Abstract warm-cream daylight, wine and gold-brown lace rosette. No text, figures, or third-party marks.</desc>
  <defs>
    <linearGradient id="day" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFBF4"/>
      <stop offset="0.38" stop-color="#FBF5EC"/>
      <stop offset="0.72" stop-color="#F6EBDD"/>
      <stop offset="1" stop-color="#F3E8DA"/>
    </linearGradient>
    <radialGradient id="candleLight" cx="0.5" cy="0.31" r="0.52">
      <stop offset="0" stop-color="#E6B85C" stop-opacity="0.20"/>
      <stop offset="0.42" stop-color="#E58AA0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FBF5EC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wineLight" cx="0.16" cy="0.82" r="0.55">
      <stop offset="0" stop-color="#7A2340" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FBF5EC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignetteLight" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.42" stop-color="#F3E8DA" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#E8D6C2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#DFC9B2" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="softLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1440" height="3120" fill="url(#day)"/>
  <rect width="1440" height="3120" fill="url(#candleLight)"/>
  <rect width="1440" height="3120" fill="url(#wineLight)"/>

  <g opacity="0.22" filter="url(#softLight)" stroke="#7A2340" fill="none">
    <circle cx="720" cy="980" r="318" stroke-width="26"/>
    <circle cx="720" cy="980" r="190" stroke-width="18"/>
  </g>

  <g fill="none" stroke="#7A5A1E" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="720" cy="980" r="292" stroke-width="2.5" stroke-opacity="0.48"/>
    <circle cx="720" cy="980" r="268" stroke-width="4" stroke-opacity="0.34" stroke-dasharray="2 16"/>
    <circle cx="720" cy="980" r="214" stroke-width="2" stroke-opacity="0.52"/>
    <circle cx="720" cy="980" r="190" stroke-width="3" stroke-opacity="0.32" stroke-dasharray="3 11"/>
    <circle cx="720" cy="980" r="132" stroke-width="2" stroke-opacity="0.56"/>
  </g>

  <g fill="none" stroke="#7A2340" stroke-linecap="round" stroke-opacity="0.38" stroke-width="2">
    <path d="M720,688 V788"/>
    <path d="M720,1172 V1272"/>
    <path d="M428,980 H528"/>
    <path d="M912,980 H1012"/>
    <path d="M514,774 L578,838"/>
    <path d="M862,1122 L926,1186"/>
    <path d="M514,1186 L578,1122"/>
    <path d="M862,838 L926,774"/>
  </g>

  <g fill="none" stroke="#7A5A1E" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" stroke-opacity="0.52">
    <path d="M720,716 C790,822 790,900 720,980 C650,900 650,822 720,716 Z"/>
    <path d="M720,716 C790,822 790,900 720,980 C650,900 650,822 720,716 Z" transform="rotate(90 720 980)"/>
    <path d="M720,716 C790,822 790,900 720,980 C650,900 650,822 720,716 Z" transform="rotate(180 720 980)"/>
    <path d="M720,716 C790,822 790,900 720,980 C650,900 650,822 720,716 Z" transform="rotate(270 720 980)"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M720,864 L836,980 L720,1096 L604,980 Z" stroke="#7A2340" stroke-width="3" stroke-opacity="0.58"/>
    <path d="M720,906 L794,980 L720,1054 L646,980 Z" stroke="#7A5A1E" stroke-width="2" stroke-opacity="0.52"/>
    <circle cx="720" cy="980" r="38" stroke="#7A5A1E" stroke-width="2" stroke-opacity="0.60"/>
    <circle cx="720" cy="980" r="8" fill="#7A2340" fill-opacity="0.80" stroke="none"/>
  </g>

  <g fill="none" stroke="#7A6355" stroke-linecap="round" stroke-opacity="0.20" stroke-width="2">
    <path d="M96,2460 C300,2380 480,2550 720,2470 C960,2390 1140,2560 1344,2470"/>
